apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a2a-agent
  template:
    metadata:
      labels:
        app: a2a-agent
    spec:
      containers:
      - name: agent
        image: a2a-dotnet-agent:local
        imagePullPolicy: Never # ローカルイメージを強制使用
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: a2a-service
spec:
  type: NodePort
  selector:
    app: a2a-agent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080 # http://localhost:30080 でアクセス可能に
